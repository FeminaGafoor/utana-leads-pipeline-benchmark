<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northbeam Supply Co. — CRM (Live)</title>
<style>
  :root { color-scheme: light; --bg: #f4f5f7; --panel: #ffffff; --border: #e2e4e8; --text: #1f2328; --muted: #6b7280; --green: #16a34a; --amber: #d97706; --red: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #16a34a, #15803d); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); }
  .status { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
  .status.connected { background: #dcfce7; color: var(--green); }
  .status.disconnected { background: #fee2e2; color: var(--red); }
  .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--border); background: #fafbfc; }
  td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .customer { font-weight: 600; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.shipped { background: #dcfce7; color: var(--green); }
  .badge.pending { background: #fef3c7; color: var(--amber); }
  .badge.delayed { background: #fee2e2; color: var(--red); }
  .editable { cursor: text; border-radius: 4px; padding: 2px 4px; }
  .editable:hover { background: #f1f5f9; outline: 1px dashed var(--border); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .25s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div><h1>Northbeam Supply Co. — Orders CRM</h1><div class="sub">Connected to real local backend (localhost:5050)</div></div>
  <div class="status disconnected" id="status">Connecting...</div>
</header>
<div class="toast" id="toast">✓ Saved to real database</div>
<script>
const API = "http://localhost:5050/api/orders";

async function load() {
  try {
    const res = await fetch(API);
    const orders = await res.json();
    document.getElementById("status").textContent = "● Connected to backend";
    document.getElementById("status").className = "status connected";
    render(orders);
  } catch (e) {
    document.getElementById("status").textContent = "● Backend not running";
    document.getElementById("status").className = "status disconnected";
    document.getElementById("rows").innerHTML = `<tr><td colspan="5" style="text-align:center;color:#dc2626;padding:30px;">Can't reach the backend. Run: <code>python server.py</code> in the northbeam-backend folder.</td></tr>`;
  }
}

function badgeClass(s) { return s === "shipped" ? "shipped" : s === "delayed" ? "delayed" : "pending"; }

function render(orders) {
  document.getElementById("rows").innerHTML = orders.map(o => `
    <tr>
      <td class="customer">${o.customer}</td>
      <td>${o.order_number}</td>
      <td class="editable" contenteditable="true" onfocus="isEditing=true" onblur="isEditing=false; save(${o.id}, 'items', this.textContent)">${o.items}</td>
      <td><span class="badge ${badgeClass(o.status)}">${o.status}</span></td>
      <td>${o.last_updated}</td>
    </tr>
  `).join('');
}

let isEditing = false;

async function save(id, field, value) {
  await fetch(`${API}/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ field, value: value.trim() })
  });
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
  isEditing = false;
  load();
}

load();
setInterval(() => { if (!isEditing) load(); }, 5000); // pause auto-refresh while a cell is focused
</script>
</body>
</html>
