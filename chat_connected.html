<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northbeam Supply Co. — Team Chat (Live)</title>
<style>
  :root { color-scheme: light; --bg:#fff; --sidebar:#1a1d29; --sidebar-hover:#262a3a; --border:#e2e4e8; --text:#1f2328; --muted:#6b7280; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); background:var(--bg); height:100vh; display:flex; }
  .sidebar { width:200px; background:var(--sidebar); color:#e5e7eb; padding:16px 0; }
  .sidebar .team { padding:0 16px 16px; font-weight:700; font-size:15px; border-bottom:1px solid #333748; margin-bottom:12px; }
  .channel { padding:7px 16px; font-size:14px; color:#cfd3e6; }
  .channel.active { background:var(--sidebar-hover); color:#fff; }
  .main { flex:1; display:flex; flex-direction:column; }
  .chan-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .chan-header h1 { font-size:15px; margin:0; }
  .status { margin-left:auto; font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; }
  .status.connected { background:#dcfce7; color:#16a34a; }
  .status.disconnected { background:#fee2e2; color:#dc2626; }
  .banner { background:#eff6ff; border-bottom:1px solid #bfdbfe; color:#1e40af; padding:10px 20px; font-size:12px; }
  .messages { flex:1; overflow-y:auto; padding:20px; }
  .msg { display:flex; gap:12px; padding:8px 0; }
  .msg .avatar { width:36px; height:36px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; }
  .msg .name { font-weight:700; font-size:14px; }
  .msg .time { font-size:11px; color:var(--muted); margin-left:8px; }
  .msg .text { font-size:14px; margin-top:2px; line-height:1.5; }
  .bot-badge { display:inline-block; font-size:10px; background:#ede9fe; color:var(--accent); padding:1px 6px; border-radius:4px; font-weight:700; margin-left:4px; }
  .composer { padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; }
  .composer input { flex:1; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:14px; }
  .composer button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="team">Northbeam Supply Co.</div>
  <div class="channel active"># ops-team</div>
  <div class="channel"># sales</div>
  <div class="channel"># general</div>
</div>
<div class="main">
  <div class="chan-header"><h1># ops-team</h1><div class="status disconnected" id="status">Connecting...</div></div>
  <div class="banner">💡 Live chat — post a message below to simulate a manager interrupting a worker agent mid-task. Verify with: curl http://localhost:5050/api/messages</div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <input type="text" id="input" placeholder="Post as Priya (e.g. an interrupting update)...">
    <button onclick="postMsg()">Post to channel</button>
  </div>
</div>
<script>
const API = "http://localhost:5050/api/messages";
const colors = { Priya: "#7c5cff", Dev: "#f59e0b", Sapi: "#2563eb" };

async function load() {
  try {
    const res = await fetch(API);
    const messages = await res.json();
    document.getElementById("status").textContent = "● Connected";
    document.getElementById("status").className = "status connected";
    render(messages);
  } catch (e) {
    document.getElementById("status").textContent = "● Backend not running";
    document.getElementById("status").className = "status disconnected";
  }
}

function render(messages) {
  const el = document.getElementById("messages");
  el.innerHTML = messages.map(m => `
    <div class="msg">
      <div class="avatar" style="background:${colors[m.who] || '#6b7280'}">${m.who[0]}</div>
      <div>
        <span class="name">${m.who}</span>${m.is_bot ? '<span class="bot-badge">AGENT</span>' : ''}<span class="time">${m.time}</span>
        <div class="text">${m.text}</div>
      </div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function postMsg() {
  const input = document.getElementById("input");
  if (!input.value.trim()) return;
  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ who: "Priya", time: "Just now", text: input.value.trim(), is_bot: 0 })
  });
  input.value = "";
  load();
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
